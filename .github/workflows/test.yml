name: Test

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build & Test
        run: chmod +x gradlew && ./gradlew build

  ui:
    name: UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

  reader:
    name: Reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-serve.txt

      - name: Install dependencies
        run: pip install -r requirements-serve.txt
        working-directory: ml

      - name: Run checks
        run: python -m tests.check
        working-directory: ml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ml/Dockerfile
          push: false
          load: true
          tags: mahjong-reader:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read one real photo through it
        run: |
          docker run -d --name reader -p 8000:8000 mahjong-reader:pr
          for _ in $(seq 40); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          python - <<'EOF' > /tmp/hand.json
          import base64, json, pathlib
          raw = pathlib.Path("ml/tests/test_hand.jpg").read_bytes()
          print(json.dumps({"imageBase64": base64.b64encode(raw).decode(), "mimeType": "image/jpeg"}))
          EOF
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data @/tmp/hand.json http://127.0.0.1:8000/recognize
          docker logs reader
