name: Test

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build & Test
        run: chmod +x gradlew && ./gradlew build

  ui:
    name: UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

  reader:
    # Built here because it is not built anywhere else before main. The image runs the ml self-checks as its
    # own last build step, so a broken reader fails this job rather than the deploy — where `needs: build`
    # turns it into a skipped deploy, and the server stops shipping too. That is exactly what happened to
    # #183: one COPY of a gitignored file, and nothing reached the server for a day and a half.
    name: Reader Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the local reader
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ml/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
