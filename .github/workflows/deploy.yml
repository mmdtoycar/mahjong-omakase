name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            docker pull "$IMAGE:latest"

            docker stop mahjong 2>/dev/null || true
            docker rm mahjong 2>/dev/null || true

            # One-time backfill: set participationBonus for existing sessions
            docker run --rm \
              -v mahjong-data:/app/data \
              "$IMAGE:latest" \
              java -cp /app/app.jar \
              -Dloader.main=org.h2.tools.Shell \
              org.springframework.boot.loader.launch.PropertiesLauncher \
              -url "jdbc:h2:file:/app/data/mahjong-omakase" -user "${{ secrets.DB_USERNAME }}" -password "${{ secrets.DB_PASSWORD }}" \
              -sql "UPDATE GAME_SESSIONS SET PARTICIPATION_BONUS = 5.0 WHERE PARTICIPATION_BONUS = 0;"

            docker run -d \
              --name mahjong \
              --restart always \
              -p 8080:8080 \
              -v mahjong-data:/app/data \
              -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
              -e CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
              "$IMAGE:latest"

            docker image prune -f
