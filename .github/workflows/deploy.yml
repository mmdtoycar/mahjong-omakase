name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  READER_IMAGE: ghcr.io/${{ github.repository }}-reader
  SHA: ${{ github.sha }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push the local reader
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ml/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.READER_IMAGE }}:latest
            ${{ env.READER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE,READER_IMAGE,SHA
          script: |
            set -e

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            docker pull "$IMAGE:$SHA"
            docker pull "$READER_IMAGE:$SHA"

            docker network inspect mahjong-net >/dev/null 2>&1 || docker network create mahjong-net

            docker rm -f mahjong-reader 2>/dev/null || true

            docker run -d \
              --name mahjong-reader \
              --restart always \
              --network mahjong-net \
              --memory 512m \
              "$READER_IMAGE:$SHA"

            docker rm -f mahjong 2>/dev/null || true

            docker run -d \
              --name mahjong \
              --restart always \
              --network mahjong-net \
              -p 127.0.0.1:8080:8080 \
              -p '[::1]:8080:8080' \
              -v mahjong-data:/app/data \
              -v mahjong-samples:/app/samples \
              -e ADMIN_EMAILS="${{ secrets.ADMIN_EMAILS }}" \
              -e CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
              -e READER_URL="http://mahjong-reader:8000" \
              "$IMAGE:$SHA"

            docker image prune -f
