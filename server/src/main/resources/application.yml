spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/mahjong-omakase;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: false
  cache:
    type: caffeine
    cache-names:
      - sessionSummaries
      - playerStats
      - homeSummary
      - activeSeasons
    caffeine:
      spec: maximumSize=200,recordStats

server:
  port: ${PORT:8080}
  # Cloudflare fronts this app, so honour X-Forwarded-Proto / -For: without it Spring believes it
  # is serving plain HTTP and can emit http:// in redirects, and every client IP logs as Cloudflare.
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin-emails: ${ADMIN_EMAILS:}

google:
  client-id: 471645797225-qtqf1nlv8l807tblfhpa9d36p5q456l3.apps.googleusercontent.com

# Photo hand recognition. Keys stay server-side — never expose them to the browser.
# Comma-separate several keys to rotate away from one that hit its quota.
# Models are a fallback chain, tried in order: a 503 is that model being over capacity, which every
# key sees alike, so the only thing that helps is a different model.
gemini:
  api-keys: ${GEMINI_API_KEYS:}
  models: ${GEMINI_MODELS:gemini-3.6-flash}
