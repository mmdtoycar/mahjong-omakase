spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/mahjong-omakase;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: false
  cache:
    type: caffeine
    cache-names:
      - sessionSummaries
      - playerStats
      - homeSummary
      - activeSeasons
    caffeine:
      spec: maximumSize=200,recordStats

server:
  port: ${PORT:8080}
  # Cloudflare fronts this app, so honour X-Forwarded-Proto / -For: without it Spring believes it
  # is serving plain HTTP and can emit http:// in redirects, and every client IP logs as Cloudflare.
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin-emails: ${ADMIN_EMAILS:}

google:
  client-id: 471645797225-qtqf1nlv8l807tblfhpa9d36p5q456l3.apps.googleusercontent.com

# Models are a fallback chain, tried in order: a 503 is that model being over capacity, which every
# key sees alike, so the only thing that helps is a different model.
# All GA, all vision-capable, each its own capacity pool. The -lite hop is a deliberate last resort:
# it is weaker at counting tiles and telling 4s from 5s, so check its output before saving — but a
# shaky read beats no read when both flash tiers are full.
# Still excluded: -pro (recognition already takes 11-24s; pro risks the 100s gateway ceiling) and
# -preview (those names get withdrawn, which would turn the fallback into a 404).
gemini:
  api-keys: ${GEMINI_API_KEYS:}
  models: ${GEMINI_MODELS:gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite}

# Every recognised photo is kept next to what the model answered, as training and evaluation data
# for a possible local tile detector. Deliberately its own volume, not the DB one: at ~1.2MB a photo
# this grows by a few hundred MB a month and would drag the nightly DB backup along with it.
# Set to an empty value to stop keeping them.
recognition:
  sample-dir: ${RECOGNITION_SAMPLE_DIR:/app/samples}
