spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/mahjong-omakase;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: false
  cache:
    type: caffeine
    cache-names:
      - sessionSummaries
      - playerStats
      - homeSummary
      - activeSeasons
    caffeine:
      spec: maximumSize=200,recordStats

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin-emails: ${ADMIN_EMAILS:}

google:
  client-id: 471645797225-qtqf1nlv8l807tblfhpa9d36p5q456l3.apps.googleusercontent.com
