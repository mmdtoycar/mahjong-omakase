# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
tone_instructions: |
  You must read .claude/commands/audit.md from this repository and check all changed code against its rules.
reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false
  tools:
    biome:
      enabled: true
    shellcheck:
      enabled: true
chat:
  auto_reply: true
