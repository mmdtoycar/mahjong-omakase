language: "en"
reviews:
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "ui/src/**"
      instructions: "Follow the audit rules defined in .claude/commands/audit.md."
    - path: "server/src/**"
      instructions: "Follow the audit rules defined in .claude/commands/audit.md."
  path_filters:
    - "!dist/**"
    - "!**/*.lock"
    - "!data/**"
  tools:
    biome:
      enabled: true
    shellcheck:
      enabled: true
chat:
  auto_reply: true
